<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملخصات التفاعلية - مساعد الشهادة السودانية</title>
    <!-- Tailwind CSS للتنسيق السريع والجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b2246; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6">

    <div class="max-w-3xl mx-auto">
        <!-- ترويسة الصفحة -->
        <div class="flex items-center justify-between mb-6 bg-slate-900/80 border border-blue-900 p-4 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-amber-400">الدروس والملخصات التفاعلية</h1>
                <p class="text-xs sm:text-sm text-slate-400">الرياضيات المتخصصة - الصف الثالث الثانوي</p>
            </div>
            <a href="index.html" class="bg-blue-900 hover:bg-blue-800 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-right"></i>
                <span>الرئيسية</span>
            </a>
        </div>

        <!-- حاوية عرض الدروس التي ستحمل البيانات من قاعدة البيانات -->
        <div id="lessons-container" class="space-y-6">
            <!-- رسالة التحميل المؤقتة -->
            <div class="text-center py-12 text-slate-400 bg-slate-900/50 border border-slate-800 rounded-2xl">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-400 mb-2"></i>
                <p>جاري تحميل الدروس من قاعدة البيانات...</p>
            </div>
        </div>
    </div>

    <!-- كود الجافاسكريبت للاتصال وجلب البيانات -->
    <script>
        // إعداد الاتصال بقاعدة البيانات باستخدام الرابط والمفتاح الخاص بك
        const supabaseUrl = "https://lhxebcykgdyxehcyohzk.supabase.co";
        const supabaseKey = "sb_publishable_hMGP3EMJNixAVn5liDeh1Q_K10Eiyeu";
        
        // تهيئة العميل
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchLessons() {
            const container = document.getElementById('lessons-container');

            try {
                // جلب الصفوف من جدول lessons حيث subject_id يساوي math
                let { data: lessons, error } = await supabase
                    .from('lessons')
                    .select('*')
                    .eq('subject_id', 'math');

                if (error) {
                    throw error;
                }

                // إذا لم توجد دروس
                if (!lessons || lessons.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 text-slate-400 bg-slate-900/50 border border-slate-800 rounded-2xl">
                            <i class="fa-solid fa-folder-open text-3xl text-slate-500 mb-2"></i>
                            <p>لا توجد دروس مضافة حالياً لهذا القسم.</p>
                        </div>
                    `;
                    return;
                }

                // تفريغ الحاوية وعرض الدروس
                container.innerHTML = '';
                lessons.forEach(lesson => {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-blue-900/60 rounded-2xl p-5 sm:p-6 shadow-xl">
                            <div class="flex items-center gap-3 mb-4 border-b border-slate-800 pb-3">
                                <div class="bg-blue-950 p-2.5 rounded-xl text-amber-400">
                                    <i class="fa-solid fa-book-open"></i>
                                </div>
                                <div>
                                    <span class="text-xs text-amber-400 font-bold">${lesson.unit_title || 'الرياضيات المتخصصة'}</span>
                                    <h2 class="text-lg font-black text-white">${lesson.lesson_title}</h2>
                                </div>
                            </div>
                            
                            <!-- هنا يظهر محتوى الـ HTML الذي أضفناه في الـ content -->
                            <div class="lesson-content text-slate-300">
                                ${lesson.content}
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error('خطأ في جلب البيانات:', err);
                container.innerHTML = `
                    <div class="text-center py-12 text-red-400 bg-slate-900/50 border border-red-900/50 rounded-2xl">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p>حدث خطأ أثناء تحميل البيانات. تحقق من إعدادات الاتصال.</p>
                    </div>
                `;
            }
        }

        // تنفيذ الدالة فور فتح الصفحة
        fetchLessons();
    </script>
</body>
</html>
