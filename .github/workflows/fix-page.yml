name: Fix lesson navigation and previous button

on:
  push:
    paths:
      - ".github/workflows/fix-page.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-lesson-navigation
  cancel-in-progress: false

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make every lesson stage clickable and repair Previous
        shell: bash
        run: |
          if grep -Fq 'السابق: التعلّم' app/page.tsx && grep -Fq 'setStage(item.id);' app/page.tsx; then
            echo "The navigation repair is already applied."
            exit 0
          fi

          echo '' | base64 --decode > /tmp/lesson-navigation.patch
          git apply --check /tmp/lesson-navigation.patch
          git apply /tmp/lesson-navigation.patch

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Commit the tested repair
        shell: bash
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo "No new changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Make lesson stages clickable and fix Previous button"
          git push
