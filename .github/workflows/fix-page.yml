      - name: Audit the lesson UX and retired-table boundary
        shell: bash
        run: |
          python3 <<'PY_AUDIT'
          from pathlib import Path

          files = {
              'inline': Path('app/page.tsx').read_text(encoding='utf-8'),
              'standalone': Path('app/InteractiveLesson.tsx').read_text(encoding='utf-8'),
          }

          required = (
              'لا توجد تدريبات على القواعد لهذا الدرس.',
              'aria-label="مراحل الدرس"',
              'aria-disabled={isUnavailable || undefined}',
              'aria-label="مسار التنقل"',
              'overflowX: "auto"',
              'textAlign: "start"',
          )
          failures = []
          for name, text in files.items():
              for token in required:
                  if token not in text:
                      failures.append(f'{name} is missing {token}')

          if 'function SubjectIcon' not in files['inline']:
              failures.append('inline lesson page is missing the reusable SubjectIcon')

          combined = '\n'.join(files.values())
          blocked = (
              '🔤',
              'متابعة',
              '.from("questions")',
              ".from('questions')",
              'public.questions',
              '/rest/v1/questions',
          )
          for token in blocked:
              if token in combined:
                  failures.append(f'blocked token is still present: {token}')

          if failures:
              raise SystemExit('UX audit failed:\n' + '\n'.join(failures))

          print('UX audit passed for inline and standalone lesson interfaces.')
          PY_AUDIT

      - name: Install dependencies and run a production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit and push the verified improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/InteractiveLesson.tsx 'app/lessons/[id]/page.tsx' app/layout.tsx
          if git diff --cached --quiet; then
            echo "The UX improvements are already present."
            exit 0
          fi
          git commit -m "Improve mobile lesson navigation and accessibility"
          git push
