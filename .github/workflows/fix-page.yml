name: Deploy complete lesson fixes

on:
  push:
    paths:
      - ".github/workflows/fix-page.yml"

permissions:
  contents: write

concurrency:
  group: deploy-complete-lesson-fixes
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the tested application fixes
        shell: bash
        run: |
          cat > /tmp/application-fixes.patch.gz.b64 <<'PATCH_DATA'
          
          PATCH_DATA
          base64 --decode /tmp/application-fixes.patch.gz.b64 | gzip --decompress > /tmp/application-fixes.patch
          git apply --check /tmp/application-fixes.patch
          git apply /tmp/application-fixes.patch

      - name: Confirm the old questions table is not referenced
        shell: bash
        run: |
          python3 <<'PY_AUDIT'
          from pathlib import Path

          blocked = (
              '.from("questions")',
              ".from('questions')",
              'public.questions',
              '/rest/v1/questions',
          )
          matches = []
          for root in (Path('app'), Path('components')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.ts', '.tsx', '.js', '.jsx'}:
                      text = path.read_text(encoding='utf-8', errors='ignore')
                      for token in blocked:
                          if token in text:
                              matches.append(f"{path}: {token}")
          if matches:
              raise SystemExit('Old questions-table references found:\n' + '\n'.join(matches))
          print('Audit passed: no application reference to public.questions.')
          PY_AUDIT

      - name: Install dependencies and run a production build
        run: |
          npm ci
          npm run build

      - name: Commit and push the verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/InteractiveLesson.tsx 'app/lessons/[id]/page.tsx' app/layout.tsx
          if git diff --cached --quiet; then
            echo "The application fixes are already present."
            exit 0
          fi
          git commit -m "Complete embedded Grammar and lesson repairs"
          git push
