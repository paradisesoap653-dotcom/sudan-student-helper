name: Deploy mobile lesson UX improvements

on:
  push:
    paths:
      - ".github/workflows/ux-lesson-improvements.yml"

permissions:
  contents: write

concurrency:
  group: deploy-mobile-lesson-ux-improvements
  cancel-in-progress: false

jobs:
  improve-and-verify:
    runs-on: ubuntu-latest
    steps:
