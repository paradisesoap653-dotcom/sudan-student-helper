name: Load books and exams from the materials table

on:
  push:
    paths:
      - ".github/workflows/materials-from-db.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materials-from-db
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the materials patch
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Commit the tested change
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo "No new changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Load books and exams from the Supabase materials table"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the Vercel production deploy
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set - deploy manually from Vercel."
            exit 0
          fi
