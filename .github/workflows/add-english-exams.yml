name: Add English 2027 exams and fix Islamic Studies link

on:
  push:
    paths:
      - ".github/workflows/add-english-exams.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-english-exams
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the content patch
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Commit the tested change
        shell: bash
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo "No new changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Add English 2027 model exams and repair Islamic Studies link"
          git push
