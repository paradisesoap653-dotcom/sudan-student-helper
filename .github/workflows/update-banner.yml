name: Add the update available banner

on:
  push:
    paths:
      - ".github/workflows/update-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-banner
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the update banner patch
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Commit the tested change
        id: commit
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No new changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx public/sw.js components/UpdateBanner.tsx
          git commit -m "Add an update available banner for the PWA"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the Vercel production deploy
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set - deploy manually from Vercel."
            exit 0
          fi

          code=$(curl -s -o /tmp/hook.txt -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP $code"
          cat /tmp/hook.txt || true
          echo

          case "$code" in
            2*) echo "Vercel deployment triggered successfully." ;;
            *)  echo "::error::The deploy hook failed with HTTP $code."; exit 1 ;;
          esac
